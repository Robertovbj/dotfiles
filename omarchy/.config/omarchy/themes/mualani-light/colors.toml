mode = "light"

# Branco do cabelo e azul do oceano tirados do wallpaper; índigo no texto, rosa dos detalhes no
# acento, amarelo dos detalhes na seleção e rosa nos ícones. O muted é um índigo acinzentado.
accent = "#da5c8f"
selection = "#f6e8a1"
muted = "#5d70a1"

# Borda ativa em degradê: azul das ondas, rosa e amarelo dos detalhes da Mualani.
hyprland_active_border = "rgba(4386deee) rgba(da5c8fee) rgba(e8be12ee) 45deg"

background = "#f4f7fe"
