red = "#a8465a"
yellow = "#7b6c01"
orange = "#a4520d"
green = "#078053"
cyan = "#037a85"
blue = "#2b6db4"
magenta = "#9e497d"
brown = "#6e4d38"

bright_red = "#b75769"
bright_yellow = "#8b7b06"
bright_green = "#179060"
bright_cyan = "#018b97"
bright_blue = "#3e7dc2"
